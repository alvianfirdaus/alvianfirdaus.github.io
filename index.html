<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Slot Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Righteous', cursive;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .reel-container {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border: 8px solid #cbd5e1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0,0,0,0.8);
            border-radius: 1rem;
        }

        .reel {
            background-color: #f1f5f9;
            color: #0f172a;
            font-size: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            width: 100px;
            border-radius: 0.5rem;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
        }

        .symbol-blur {
            filter: blur(4px);
            opacity: 0.8;
        }

        .win-pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(234, 179, 8, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }

        .digital-font {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md w-full flex flex-col gap-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-4xl md:text-5xl font-bold text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.8)] tracking-wider">
                asep zainal slot
            </h1>
            <p class="text-slate-400 text-sm tracking-widest uppercase">Simulator Hiburan</p>
        </div>

        <!-- Info Panel (Saldo & Info) -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center shadow-lg">
            <div>
                <p class="text-slate-400 text-xs uppercase mb-1">Saldo Koin</p>
                <p class="text-2xl text-emerald-400 digital-font font-bold" id="balance-display">🪙 1000</p>
            </div>
            <div class="text-right">
                <p class="text-slate-400 text-xs uppercase mb-1">Menang Terakhir</p>
                <p class="text-xl text-yellow-400 digital-font font-bold" id="win-display">0</p>
            </div>
        </div>

        <!-- Slot Machine -->
        <div class="reel-container p-4 flex gap-2 md:gap-4 justify-center relative">
            <div class="absolute top-0 left-0 w-full h-full pointer-events-none rounded-xl bg-gradient-to-b from-black/20 via-transparent to-black/20 z-10"></div>
            
            <div class="reel" id="reel-1">
                <span class="symbol">7️⃣</span>
            </div>
            <div class="reel" id="reel-2">
                <span class="symbol">7️⃣</span>
            </div>
            <div class="reel" id="reel-3">
                <span class="symbol">7️⃣</span>
            </div>
        </div>

        <!-- Status Message -->
        <div id="status-message" class="text-center h-8 text-lg font-bold text-slate-300">
            Siap untuk memutar!
        </div>

        <!-- Controls -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col gap-4 shadow-lg">
            <div class="flex justify-between items-center bg-slate-900 p-2 rounded-lg border border-slate-700">
                <p class="text-slate-400 text-sm pl-2">Taruhan:</p>
                <div class="flex gap-2">
                    <button class="bet-btn bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-white digital-font active" data-bet="10">10</button>
                    <button class="bet-btn bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-white digital-font" data-bet="50">50</button>
                    <button class="bet-btn bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-white digital-font" data-bet="100">100</button>
                </div>
            </div>
            
            <button id="spin-btn" class="w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white py-4 rounded-lg text-2xl font-bold tracking-widest shadow-[0_5px_0_#991b1b] active:shadow-[0_0px_0_#991b1b] active:translate-y-[5px] transition-all uppercase">
                SPIN!
            </button>
        </div>

        <!-- Disclaimer -->
        <p class="text-center text-xs text-slate-500 mt-4 font-sans">
            *Game ini murni untuk simulasi dan hiburan. Tidak ada uang asli yang digunakan atau dimenangkan.
        </p>

    </div>

    <script>
        // Game State
        let balance = 1000;
        let currentBet = 10;
        let isSpinning = false;

        // Symbols and their relative values/weights
        // 🍒 (Cherry) - Lowest, 💎 (Diamond) - High, 7️⃣ (Seven) - Jackpot
        const symbols = ['🍒', '🍋', '🍉', '🍇', '🔔', '💎', '7️⃣'];
        
        // Payout multipliers (3 of a kind)
        const payouts = {
            '🍒': 2,
            '🍋': 3,
            '🍉': 4,
            '🍇': 5,
            '🔔': 10,
            '💎': 20,
            '7️⃣': 50
        };

        // DOM Elements
        const balanceDisplay = document.getElementById('balance-display');
        const winDisplay = document.getElementById('win-display');
        const statusMessage = document.getElementById('status-message');
        const spinBtn = document.getElementById('spin-btn');
        const reels = [
            document.getElementById('reel-1').querySelector('.symbol'),
            document.getElementById('reel-2').querySelector('.symbol'),
            document.getElementById('reel-3').querySelector('.symbol')
        ];
        const reelContainers = [
            document.getElementById('reel-1'),
            document.getElementById('reel-2'),
            document.getElementById('reel-3')
        ];
        const betBtns = document.querySelectorAll('.bet-btn');

        // Bet Selection Logic
        betBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (isSpinning) return;
                
                // Update active state
                betBtns.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'hover:bg-indigo-500', 'active');
                    b.classList.add('bg-slate-700', 'hover:bg-slate-600');
                });
                
                const target = e.target;
                target.classList.remove('bg-slate-700', 'hover:bg-slate-600');
                target.classList.add('bg-indigo-600', 'hover:bg-indigo-500', 'active');
                
                currentBet = parseInt(target.getAttribute('data-bet'));
                updateStatus(`Taruhan diatur: ${currentBet}`);
            });
        });

        // Initialize first bet button as active
        betBtns[0].click();

        // Helper functions
        function updateBalance(amount) {
            balance += amount;
            balanceDisplay.innerText = `🪙 ${balance}`;
        }

        function updateStatus(msg, color = 'text-slate-300') {
            statusMessage.innerText = msg;
            statusMessage.className = `text-center h-8 text-lg font-bold ${color}`;
        }

        function getRandomSymbol() {
            // Simple random for simulation
            const randomIndex = Math.floor(Math.random() * symbols.length);
            return symbols[randomIndex];
        }

        // Spin Animation Logic
        function spinReel(reelElement, duration) {
            return new Promise((resolve) => {
                let interval;
                let startTime = Date.now();
                
                reelElement.classList.add('symbol-blur');

                interval = setInterval(() => {
                    reelElement.innerText = getRandomSymbol();
                    
                    if (Date.now() - startTime > duration) {
                        clearInterval(interval);
                        reelElement.classList.remove('symbol-blur');
                        const finalSymbol = getRandomSymbol();
                        reelElement.innerText = finalSymbol;
                        resolve(finalSymbol);
                    }
                }, 50); // Speed of blur spinning
            });
        }

        // Main Game Loop
        spinBtn.addEventListener('click', async () => {
            if (isSpinning) return;

            if (balance < currentBet) {
                updateStatus("Saldo tidak cukup!", "text-red-400");
                // Visual shake
                balanceDisplay.classList.add('text-red-500', 'animate-pulse');
                setTimeout(() => balanceDisplay.classList.remove('text-red-500', 'animate-pulse'), 1000);
                return;
            }

            // Start Spin
            isSpinning = true;
            updateBalance(-currentBet);
            winDisplay.innerText = "0";
            updateStatus("Memutar...", "text-yellow-400");
            
            // Remove previous win animations
            reelContainers.forEach(container => container.classList.remove('win-pulse', 'border-yellow-400'));
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // Spin reels with staggering durations
            const results = await Promise.all([
                spinReel(reels[0], 1000),
                spinReel(reels[1], 1500),
                spinReel(reels[2], 2000)
            ]);

            checkWin(results);
            
            isSpinning = false;
            spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        });

        function checkWin(results) {
            const [s1, s2, s3] = results;
            
            // Check for 3 of a kind
            if (s1 === s2 && s2 === s3) {
                const multiplier = payouts[s1];
                const winAmount = currentBet * multiplier;
                
                updateBalance(winAmount);
                winDisplay.innerText = `+${winAmount}`;
                updateStatus(`JACKPOT! Menang ${winAmount} koin!`, "text-green-400");
                
                // Add win animation to all reels
                reelContainers.forEach(container => {
                    container.classList.add('win-pulse', 'border-yellow-400');
                });
            } 
            // Check for 2 of a kind (small win, just return bet)
            else if (s1 === s2 || s2 === s3 || s1 === s3) {
                const winAmount = currentBet; // Just get bet back
                updateBalance(winAmount);
                winDisplay.innerText = `+${winAmount}`;
                updateStatus("Bagus! Kembali modal.", "text-emerald-400");
                
                // Highlight winning reels
                if (s1 === s2) {
                    reelContainers[0].classList.add('win-pulse');
                    reelContainers[1].classList.add('win-pulse');
                } else if (s2 === s3) {
                    reelContainers[1].classList.add('win-pulse');
                    reelContainers[2].classList.add('win-pulse');
                } else {
                    reelContainers[0].classList.add('win-pulse');
                    reelContainers[2].classList.add('win-pulse');
                }
            } 
            // Loss
            else {
                updateStatus("Coba lagi!", "text-slate-400");
            }
        }
    </script>
</body>
</html>
